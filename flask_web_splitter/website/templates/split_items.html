{% extends "base.html" %} {% block title %}Split things{% endblock %}

{% block content %}
<style>
        body{
            background:#8396d4;
        }
</style>
<form method="POST">
    <h1 align="center">Split</h1>
    <br>
    <button type="button" class="side-by-side" id="enter-bill" align="center">Enter Bill</button>
    <input type="text" class="side-by-side" id="search-bills" placeholder="Search bill">
    <select id="filter-bills" class="side-by-side">
        <option value="all">All bills</option>
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
    </select>
    <br>
    <br>
    <div class="side-by-side" style="display: flex; gap:15px; margin-bottom:5px; ">
        <h6 style="flex:1;margin:0;">Item</h6>
        <h6 style="flex:1;margin:0;">Total amount</h6>
        <h6 style="flex:1;margin:0;">Number of people</h6>
        <h6 style="flex:1;margin:0;">Already paid</h6>
        <h6 style="flex:1; margin:0;">Due Date</h6>
    </div>
    
    <div id="bill-modal" class="modal">
        <div class="modal-content">
            <h2 align="center">Enter your bill</h2>
            <br>
            <input type="text" name="item" placeholder="What are you splitting?">
            <input type="number" name="total_amount" placeholder="Total amount">
            <input type="number" name="number_people" placeholder="Number of people">
            <input type="number" name="budget" placeholder="Already paid">
            <input type="date" name="due_date" placeholder="Due Date">
            <button type="submit">Continue</button>
            <br>
            <button type="button" id="close-modal">Cancel</button>
        </div>
    </div>
    <div id="change-bill-modal" class="modal">
        <div class="modal-content">
            <h2 align="center">Change your bill settings</h2>
            <br>
            <input type="hidden" id="edit-id">
            <input type="text" id="edit-item" readonly>
            <input type="number" id="edit-total" >
            <input type="number" id="edit-people">
            <input type="number" id="edit-budget" >
            <input type="date" id="edit-date">
           
            <button type="button" id="save-changes">Continue</button>
            <br>
            <button type="button" id="close-change-modal">Cancel</button>
        </div>
    </div>
    <div id="show-modal">
        <ul style="list-style: none; padding:0; margin:0;">
            {% for split in splits %}
            <li class="bill-card" data-status="{{'paid' if split.total_amount == split.budget else 'unpaid'}}" style="display:flex;gap:15px;margin-bottom:10px; padding:0;border:none;">
                    <textarea style="resize: none; flex:1; width:100%;" readonly>{{split.item}}</textarea>
                    <textarea style="resize: none; flex:1; width:100%" readonly>{{split.total_amount}}</textarea>                
                    <textarea style="resize: none; flex:1; width:100%" readonly>{{split.number_people}}</textarea>                
                    <textarea style="resize: none; flex:1; width:100%" readonly>{{split.budget}}</textarea>
                    <textarea style="resize: none; flex:1; width:100%" readonly>{{split.due_date}}</textarea>
                    
                    <button type="button" class="change-bill" data-id="{{split.id}}" data-item="{{split.item}}" data-total="{{split.total_amount}}" data-people="{{split.number_people}}" data-budget="{{split.budget}}" data-date="{{split.due_date}}">Change</button>
                    <br>
                    <button type="button" class="close" data-item-id="{{ split.id }}" onclick="deleteItem(this.dataset.itemId)">
                        <span aria-hidden="true">&times;</span>
                    </button>
            </li>
            {% endfor %}   
            
        </ul>
        <br>
    </div>
</form>


{% endblock %}
